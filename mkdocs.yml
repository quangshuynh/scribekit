site_name: ScribeKit
site_description: >-
  Native macOS app for live, local-first meeting transcription with selective
  app audio capture and durable Markdown output.
site_url: https://quangshuynh.github.io/scribekit/
site_author: quangshuynh

repo_url: https://github.com/quangshuynh/scribekit
repo_name: quangshuynh/scribekit
edit_uri: edit/main/docs/

copyright: Licensed under the MIT License

# Anchors and unrecognised links are only INFO by default, so a strict build
# would not catch a cross-reference pointing at a heading that moved. Both are
# raised to warnings so that `mkdocs build --strict` fails on them.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  # The app icon is a transparent PNG, so one asset reads against both the
  # light and the dark header.
  logo: images/scribekit-logo2.png
  favicon: images/scribekit-logo2.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Top-level sections become tabs and the second level becomes the sidebar,
    # which is what keeps seven sections navigable.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/scribekit.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        # Mermaid renders natively on GitHub and through this fence in
        # Material, so one diagram source works in both places.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/quangshuynh/scribekit
      name: ScribeKit on GitHub

